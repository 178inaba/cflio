name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # No separate build step for this platform: go test compiles every
      # matched package, including ones without test files (the root
      # main.go), so a compile failure there fails this step too.
      - run: go test -race ./...
      # That reasoning stops at the build-tagged re-raise, whose Windows half
      # no linux run ever compiles. Releases ship a Windows archive, so a break
      # here would fail the release build — catching it on the pull request is
      # what this step is for.
      - run: GOOS=windows go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # golangci-lint-action resolves an empty tag — and a `latest` tag — to
      # whatever the newest release is, so a compose.yaml that lost its pin
      # would leave this job green and silently unpinned. Any other malformed
      # value already makes the action throw. This needs nothing but the
      # checkout, so it runs before the toolchain install.
      - name: Read the golangci-lint version from compose.yaml
        id: version
        run: |
          image=$(yq '.services.lint.image' compose.yaml)
          version=${image##*:}
          [[ "$version" == v* ]] || { echo "::error::could not read the golangci-lint version from compose.yaml (got '$version')"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # This failure class is silent by construction: every fact asserted below
      # can break without turning anything red, and the first signal is a user
      # whose skill has drifted from the binary it describes. `// ""`, the
      # object check, and the `||` guard on each keep a break reported as the
      # assertion rather than as a jq or shell error.
      - name: Check the plugin distribution wiring
        run: |
          jq -e '(.version // "") | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .claude-plugin/plugin.json >/dev/null \
            || { echo "::error::.claude-plugin/plugin.json needs a bare semver version, the form tagpr writes through versionFile"; exit 1; }
          jq -e '.plugins[0] | has("version") | not' .claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::the .claude-plugin/marketplace.json plugins entry must not carry a version; Claude Code always reads the manifest's, so a stale manifest would mask it"; exit 1; }
          jq -e '.plugins[0].source | type == "object" and .ref == "stable"' .claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::the .claude-plugin/marketplace.json plugins entry's source must be an object resolving through ref \"stable\""; exit 1; }
          [[ "$(git config -f .tagpr tagpr.versionFile)" == .claude-plugin/plugin.json ]] \
            || { echo "::error::.tagpr must set versionFile to .claude-plugin/plugin.json, or tagpr stops bumping the version that stable ships"; exit 1; }
          install_url="https://github.com/$(jq -r '.plugins[0].source.repo' .claude-plugin/marketplace.json)/tree/$(jq -r '.plugins[0].source.ref' .claude-plugin/marketplace.json)"
          grep -qxF "npx skills add $install_url" README.md \
            || { echo "::error::README.md must carry the line 'npx skills add $install_url', the URL form of the install command; the comment beside it in README.md records why"; exit 1; }
      # Required by golangci-lint-action, and the Go problem matcher it
      # registers is what turns findings into inline PR annotations.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.version.outputs.version }}
      # The release workflow only reaches GoReleaser once a tag exists, so a
      # broken .goreleaser.yaml would otherwise surface after the release PR is
      # merged, with the tag already pushed. The version has to be the one
      # release.yml releases with, or this validates the config against a
      # GoReleaser that never builds it — change the two together.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
